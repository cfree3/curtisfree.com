---
title: Blog
layout: blog
---
<div id="post_list">
  {%- for post in site.categories.blog %}
    <div class="post_link"><a href="{{ post.url }}">{{ post.title }}</a></div>
    <div class="post_date">
      {%- capture year -%}{{ post.date | date:'%Y' }}{%- endcapture -%}
        {%- if year != previous_year -%}
          {{ year }}
        {%- capture previous_year -%}{{ year }}{%- endcapture -%}
      {%- endif -%}
    </div>
  {%- endfor %}
</div>
