
<!--Meta -->
<meta http-equiv="content-type" content="text/html; charset=utf-8">
<meta name="author" content="{{ site.author }}">
<meta name="description" content="{{ site.description }}">

<!-- Style -->
<link rel="stylesheet" href="/style.css">

<!-- Icon -->
<link rel="icon" type="image/png" href="/assets/icon.png">

<!-- Verification -->
<meta name="google-site-verification" content="{{ site.verification.google.key }}">
{% if page.error %}
<!-- Error Page (No Canonicalization) -->
{% else %}
<!-- Canonicalization -->
<link rel="canonical" href="{{ site.url }}{{ page.url | remove_first:'index.html' }}">
{%- endif -%}
{%- if page.title == '' %}

<!-- Me! -->
<div class="hidden">
{% for profile in site.me %}
  <a rel="me" href="{{ profile.url }}">{{ profile.name }}</a>
{%- endfor %}
{{ page.title }}
</div>
{%- endif %}

<!-- Headline -->
<div id="{%- if page.title and page.title != '' -%}container{%- else -%}profile{%- endif -%}">
  <div id="header">
    <div id="name">
      <a href="/"><h1>Curtis&nbsp;Free</h1></a>
    </div>
    <div id="links">
      <h2><a href="https://www.curtisandrebecca.com">Husband</a>&nbsp;&middot;&nbsp;<a href="https://www.matthewdrakefree.com">Dad</a>&nbsp;&middot;&nbsp;Geek</h2>
      <p>
        <a href="/about/">About</a>
        |
        <a href="/blog/">Blog</a>
        |
        <a href="{{ site.code.url }}">Code</a>
    </div>
  </div>
{% if page.title and page.title != '' or page.layout == 'error' %}
  <div id="content">

<!-- Content -->
{% endif %}
